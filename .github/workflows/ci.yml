name: C++ CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            meson \
            ninja-build \
            libeigen3-dev \
            libboost-random-dev \
            libboost-filesystem-dev \
            libboost-program-options-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install meson ninja eigen boost

      - name: Configure
        run: >-
          meson setup build
          --buildtype=release
          -Dprograms=true
          -Dtests=true

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --print-errorlogs

      - name: Stage install
        run: meson install -C build --destdir "${{ runner.temp }}/diversinet-stage"
